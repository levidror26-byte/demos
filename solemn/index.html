<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLEMN Sneaker Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: the page is the boutique wall. Tap a pair and the camera travels to it; close and it pulls back out. */
:root{
  --wall:#0f0d0c;
  --ink:#f1ece6;
  --muted:#8d847c;
  --led:#ff7b1c;
  --line:rgba(241,236,230,.1);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--wall);color:var(--ink)}
body{font-family:var(--display);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--led);outline-offset:3px}
img,video{display:block;max-width:100%}

.top{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px clamp(16px,4vw,44px);background:linear-gradient(rgba(10,8,8,.85),transparent)}
.logo{font-weight:800;font-stretch:75%;letter-spacing:.32em;font-size:15px}
.logo span{color:var(--led)}
.nav{display:flex;align-items:center;gap:clamp(14px,3vw,30px);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav a{color:inherit;text-decoration:none}
.nav a:hover{color:var(--ink)}
.bag{display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.bag b{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--led);color:#160b03;font-weight:600;font-size:11px;transition:transform .3s}
.bag b.pop{transform:scale(1.35)}

/* The scene */
.scene{position:relative;background:#000;isolation:isolate;overflow:hidden}
.stage{position:relative;width:100%;aspect-ratio:16/9;max-height:100svh;overflow:hidden}
.cam{position:absolute;inset:0;transition:transform 1.1s var(--ease);will-change:transform}
.cam img{width:100%;height:100%;object-fit:cover}
.scene video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;z-index:1;transition:transform .5s var(--ease)}
.scene video.on{opacity:1}
.scene video.top{z-index:2}
.scene video.fade{transition:opacity .35s,transform .5s var(--ease)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55)),linear-gradient(transparent 70%,rgba(15,13,12,.9))}

.spots{position:absolute;inset:0;z-index:4;transition:opacity .3s}
.scene.busy .spots,.scene.focused .spots{opacity:0;pointer-events:none}
.spot{position:absolute;border-radius:6px}
.spot::before{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 1px rgba(255,123,28,0);transition:.35s}
.spot:hover::before,.spot:focus-visible::before{box-shadow:0 0 0 1px rgba(255,170,110,.55),0 0 40px rgba(255,123,28,.25)}
.spot .lbl{position:absolute;left:50%;bottom:-6px;transform:translate(-50%,100%);white-space:nowrap;
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:20px;
  background:rgba(15,13,12,.8);border:1px solid rgba(255,123,28,.35);opacity:0;transition:.3s}
.spot:hover .lbl,.spot:focus-visible .lbl{opacity:1;transform:translate(-50%,calc(100% + 4px))}
.spot .dot{position:absolute;left:50%;top:-10px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--led);
  box-shadow:0 0 0 0 rgba(255,123,28,.6);animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,123,28,.55)}70%{box-shadow:0 0 0 12px rgba(255,123,28,0)}100%{box-shadow:0 0 0 0 rgba(255,123,28,0)}}

.caption{padding-bottom:clamp(8px,2vw,20px)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--led);margin-bottom:10px}
h1{font-weight:850;font-stretch:68%;font-size:clamp(34px,6.5vw,96px);line-height:.86;text-transform:uppercase;text-wrap:balance}
h1 em{font-style:normal;color:transparent;-webkit-text-stroke:1px rgba(241,236,230,.6)}
.hint{position:absolute;right:clamp(16px,4vw,44px);bottom:clamp(16px,3vw,38px);z-index:5;font-family:var(--mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted);transition:opacity .4s}
.scene.busy .hint,.scene.focused .hint{opacity:0}

/* Product panel */
.panel{position:absolute;top:0;right:0;bottom:0;z-index:6;width:min(400px,32%);padding:84px clamp(18px,2.6vw,40px) 28px;
  display:flex;flex-direction:column;gap:18px;overflow-y:auto;
  background:linear-gradient(90deg,rgba(15,13,12,0),rgba(15,13,12,.82) 14%,rgba(15,13,12,.95));
  transform:translateX(104%);transition:transform .7s var(--ease)}
.scene.focused .panel{transform:none}
.scene.focused video.on{transform:translateX(-14%)}
.p-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.close{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:16px;color:var(--ink);background:rgba(15,13,12,.6)}
.close:hover{border-color:var(--led)}
.p-name{font-weight:850;font-stretch:66%;font-size:clamp(36px,4.4vw,68px);line-height:.88;text-transform:uppercase}
.p-sub{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.5;max-width:40ch}
.p-price{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.p-price small{font-size:11px;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:.1em}
.sizes-h{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.sizes button{height:42px;border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;background:rgba(15,13,12,.5);transition:.2s}
.sizes button:hover{border-color:rgba(241,236,230,.4)}
.sizes button[aria-pressed="true"]{border-color:var(--led);background:rgba(255,123,28,.14);color:#ffd2b0}
.sizes button:disabled{opacity:.28;text-decoration:line-through;cursor:not-allowed}
.add{height:52px;border-radius:4px;background:var(--led);color:#170b02;font-weight:800;font-stretch:80%;font-size:15px;letter-spacing:.14em;text-transform:uppercase;
  box-shadow:0 0 30px rgba(255,123,28,.35);transition:transform .2s,box-shadow .2s;flex-shrink:0}
.add:hover{transform:translateY(-1px);box-shadow:0 0 44px rgba(255,123,28,.5)}
.add[data-hint]{background:transparent;color:var(--led);border:1px solid var(--led);box-shadow:none}
.specs{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;font-size:13px;border-top:1px solid var(--line);padding-top:16px}
.specs dt{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;padding-top:2px}

/* Index under the wall */
.index{padding:clamp(28px,5vw,56px) clamp(16px,4vw,44px);display:grid;gap:18px}
.index-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:14px;background:var(--wall);text-align:left;transition:background .25s}
.item:hover{background:#1a1614}
.item img{width:56px;height:56px;object-fit:cover;border-radius:3px}
.item b{display:block;font-weight:800;font-stretch:72%;font-size:18px;text-transform:uppercase;line-height:1}
.item small{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.item span{font-family:var(--mono);font-size:12px;color:var(--led)}
.band{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:12px 0;font-weight:800;font-stretch:62%;font-size:clamp(20px,3vw,36px);text-transform:uppercase}
.band div{display:inline-block;animation:slide 40s linear infinite}
.band i{font-style:normal;color:var(--led);padding:0 .6em}
@keyframes slide{to{transform:translateX(-50%)}}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:26px clamp(16px,4vw,44px) 36px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}

.toast{position:fixed;left:50%;bottom:24px;z-index:80;transform:translate(-50%,30px);opacity:0;transition:.35s;
  background:#201b19;border:1px solid rgba(255,123,28,.4);border-radius:40px;padding:12px 20px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .nav a{display:none}
  .scene{margin-top:56px}
  .stage::after{background:linear-gradient(transparent 80%,rgba(15,13,12,.6))}
  .hint{display:none}
  .spot .lbl{display:none}
  .panel{position:static;width:auto;transform:none;background:none;padding:18px 16px 8px;display:none}
  .scene.focused .panel{display:flex}
  .scene.focused video.on{transform:none}
  .p-top{position:absolute;top:8px;right:8px;z-index:7}
  .scene.focused .p-top{position:fixed;top:64px;right:12px}
  .p-top span{display:none}
  .list{grid-template-columns:1fr 1fr}
  .item{grid-template-columns:auto 1fr;padding:10px}
  .item span{grid-column:2}
  .item img{width:48px;height:48px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="logo">SOLEMN<span>.</span></div>
  <nav class="nav" aria-label="Main">
    <a href="#index">Archive</a>
    <a href="#index">Drops</a>
    <a href="#index">Stores</a>
    <span class="bag">Bag <b id="bagCount">0</b></span>
  </nav>
</header>

<section class="scene" id="scene" aria-label="The wall">
  <div class="stage" id="stage">
  <div class="cam" id="cam"><img src="img/wall.webp" alt="Dark boutique wall with eight sneakers on two lit shelves"></div>
  <div id="videos"></div>
  <div class="spots" id="spots"></div>
  <div class="hint">Tap a pair</div>
  </div>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="p-top"><span id="pTier">Tier 01 / 08</span><button class="close" id="close" aria-label="Back to the wall">✕</button></div>
    <div>
      <h2 class="p-name" id="pName">—</h2>
      <p class="p-sub" id="pSub"></p>
    </div>
    <div class="p-price" id="pPrice"></div>
    <div>
      <div class="sizes-h"><span>Size (EU)</span><span id="pStock"></span></div>
      <div class="sizes" id="sizes"></div>
    </div>
    <button class="add" id="add">Add to bag</button>
    <dl class="specs" id="specs"></dl>
  </aside>
</section>

<section class="index" id="index">
  <div class="caption">
    <p class="eyebrow">Drop 01 · The Wall</p>
    <h1>Eight pairs.<br><em>No restocks.</em></h1>
  </div>
  <div class="index-h"><span>Index</span><span>08 silhouettes · numbered runs of 250</span></div>
  <div class="list" id="list"></div>
</section>

<div class="band" aria-hidden="true"><div id="band"></div></div>
<footer class="foot">
  <span>SOLEMN Archive © 2026 · Tel Aviv · Paris</span>
  <span>Free shipping over ₪800 · 30-day returns</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* box = hotspot on the wall in % (x, y, w, h). in/out = camera move videos; pairs without them get a CSS push-in. */
const PAIRS = [
  {id:"01", name:"Aero Pillow", color:"Cobalt", price:890, img:"img/snk-01.webp", box:[7,18,18,19], clip:"vid/c01.mp4",
   sub:"Quilted cobalt leather pods over a breathable mesh base, riding on a clear air-cell sole.",
   upper:"Glossy quilted leather, engineered mesh", sole:"Translucent air-cell unit", weight:"412 g", out:[39,46]},
  {id:"02", name:"Monolith Mid", color:"Blush", price:960, img:"img/snk-02.webp", box:[30,16,18,21], clip:"vid/c02.mp4",
   sub:"A seamless sock-knit upper locked down by one padded strap, on a ribbed translucent sole.",
   upper:"Seamless knit, padded buckle strap", sole:"Ribbed translucent rubber", weight:"402 g", out:[40]},
  {id:"03", name:"Ridge TR", color:"Ash", price:780, img:"img/snk-03.webp", box:[52,18,18,19], clip:"vid/c03.mp4",
   sub:"Ripstop trail runner with toggle lacing and a lugged outsole built for gravel and city kerbs.",
   upper:"Graphite ripstop, TPU cage", sole:"Multi-directional lug rubber", weight:"376 g", out:[]},
  {id:"04", name:"Court 74", color:"Bone", price:640, img:"img/snk-04.webp", box:[75,20,18,17], clip:"vid/c04.mp4",
   sub:"The quiet one. Full-grain off-white leather on a stitched gum cupsole.",
   upper:"Full-grain leather", sole:"Stitched gum cupsole", weight:"430 g", out:[44,45]},
  {id:"05", name:"Ember Knit", color:"Coral / Red", price:720, img:"img/snk-05.webp", box:[7,60,18,18], clip:"vid/c05.mp4",
   sub:"Engineered knit that fades from coral to red, over a sculpted white foam ride.",
   upper:"Engineered knit, gradient dye", sole:"Sculpted foam midsole", weight:"298 g", out:[39]},
  {id:"06", name:"Varsity Hi", color:"Forest", price:820, img:"img/snk-06.webp", box:[30,57,18,21], clip:"vid/c06.mp4",
   sub:"Old-gym proportions in white leather with forest-green suede overlays and a padded collar.",
   upper:"Leather with suede overlays", sole:"Cream rubber cupsole", weight:"520 g", out:[41,46]},
  {id:"07", name:"Glacier", color:"Ice", price:740, img:"img/snk-07.webp", box:[52,60,18,18], clip:"vid/c07.mp4",
   sub:"Frosted mesh and ice-blue accents on a fully transparent jelly sole.",
   upper:"Frosted translucent mesh", sole:"Clear jelly rubber", weight:"334 g", out:[]},
  {id:"08", name:"Null", color:"Onyx", price:870, img:"img/snk-08.webp", box:[75,61,18,17], clip:"vid/c08.mp4",
   sub:"Matte black nubuck with reflective silver piping that only shows up under flash.",
   upper:"Matte nubuck, 3M piping", sole:"Sculpted black midsole", weight:"448 g", out:[42]},
];
const SIZES = [39,40,41,42,43,44,45,46];
const fmt = n => "₪" + n.toLocaleString("en-US");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const scene = $("scene"), cam = $("cam");

/* Hotspots + preloaded camera videos */
PAIRS.forEach((p,i)=>{
  const [x,y,w,h] = p.box;
  const b = document.createElement("button");
  b.className = "spot";
  b.style.cssText = `left:${x}%;top:${y}%;width:${w}%;height:${h}%`;
  b.setAttribute("aria-label", `${p.name} ${p.color}, ${fmt(p.price)}`);
  b.innerHTML = `<i class="dot"></i><span class="lbl">${p.name} · ${fmt(p.price)}</span>`;
  b.addEventListener("click", ()=>open(i));
  $("spots").appendChild(b);
  if(p.clip) p.el = mkVideo(p.clip);
});
function mkVideo(src){
  const v = document.createElement("video");
  v.src = src; v.muted = true; v.playsInline = true; v.preload = "auto";
  v.setAttribute("playsinline",""); v.setAttribute("muted","");
  $("videos").appendChild(v); return v;
}

/* Subtle parallax on the wall */
let px = 0, py = 0;
scene.addEventListener("pointermove", e=>{
  if(reduce || scene.classList.contains("busy") || scene.classList.contains("focused")) return;
  const r = scene.getBoundingClientRect();
  px = ((e.clientX - r.left)/r.width - .5); py = ((e.clientY - r.top)/r.height - .5);
  cam.style.transform = `translate(${px*-1.2}%, ${py*-.9}%) scale(1.03)`;
});
scene.addEventListener("pointerleave", ()=>{ if(!scene.classList.contains("focused") && !busy) cam.style.transform = ""; });

/* Panel */
let current = -1, size = null, bag = 0, busy = false;
function fill(p){
  $("pTier").textContent = `Tier ${p.id} / 08`;
  $("pName").innerHTML = `${p.name}<br>${p.color}`;
  $("pSub").textContent = p.sub;
  $("pPrice").innerHTML = `${fmt(p.price)}<small>incl. VAT</small>`;
  const left = SIZES.length - p.out.length;
  $("pStock").textContent = left <= 6 ? `${left} sizes left` : "All sizes";
  $("sizes").innerHTML = SIZES.map(s=>`<button ${p.out.includes(s)?"disabled":""} aria-pressed="false" data-s="${s}">${s}</button>`).join("");
  $("specs").innerHTML = `<dt>Upper</dt><dd>${p.upper}</dd><dt>Sole</dt><dd>${p.sole}</dd><dt>Weight</dt><dd>${p.weight} (EU 42)</dd><dt>Run</dt><dd>Numbered, 250 pairs</dd>`;
  size = null; resetAdd();
}

const wait = ms => new Promise(r=>setTimeout(r, ms));
const once = (el, ev) => new Promise(r=>el.addEventListener(ev, r, {once:true}));
/* resolves once the video has actually painted a frame */
function firstFrame(v){
  return new Promise(r=>{
    if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(()=>r());
    else v.addEventListener("playing", ()=>requestAnimationFrame(()=>requestAnimationFrame(r)), {once:true});
  });
}
function rewind(v){
  v.pause();
  if(v.currentTime === 0) return Promise.resolve();
  const s = once(v, "seeked"); v.currentTime = 0; return s;
}

/* plays until the camera reaches the shoe (end of the first half), then holds that frame */
function playToMid(v){
  return new Promise(res=>{
    const mid = (v.duration || 8) / 2 - 0.03;
    if(v.requestVideoFrameCallback){
      const tick = (now, meta)=>{ if(meta.mediaTime >= mid){ v.pause(); res(); } else v.requestVideoFrameCallback(tick); };
      v.requestVideoFrameCallback(tick);
    } else {
      const t = setInterval(()=>{ if(v.currentTime >= mid){ clearInterval(t); v.pause(); res(); } }, 15);
    }
  });
}

async function open(i){
  if(busy) return;
  busy = true; current = i;
  const p = PAIRS[i];
  fill(p);
  scene.classList.add("busy");
  if(innerWidth <= 820) scene.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"});
  cam.style.transform = "";
  let played = false;
  if(p.el && !reduce){
    const v = p.el;
    await rewind(v);
    const ff = firstFrame(v), mid = playToMid(v);
    try{
      await v.play();
      await ff;
      v.classList.add("on");
      await mid;
      played = true;
    }catch(e){ v.classList.remove("on"); }
  }
  if(!played){
    const [x,y,w,h] = p.box, cx = x + w/2, cy = y + h/2;
    const tx = innerWidth > 820 ? 34 : 50;
    cam.style.transformOrigin = `${cx}% ${cy}%`;
    cam.style.transform = `translate(${tx-cx}%, ${50-cy}%) scale(2.6)`;
    await wait(reduce ? 0 : 1100);
  }
  p.usedVideo = played;
  scene.classList.remove("busy");
  scene.classList.add("focused");
  busy = false;
  setTimeout(()=>$("close").focus({preventScroll:true}), 400);
}

async function close(){
  if(busy || current < 0) return;
  busy = true;
  const p = PAIRS[current];
  scene.classList.remove("focused");
  scene.classList.add("busy");
  if(p.usedVideo){
    const v = p.el;
    await wait(innerWidth > 820 ? 500 : 0);   /* shoe slides back to centre while the panel leaves */
    const ended = once(v, "ended");
    try{ await v.play(); await ended; }catch(e){}   /* same clip carries on: camera pulls back to the wall */
    v.classList.add("fade");
    v.classList.remove("on");
    await wait(360);
    v.classList.remove("fade");
    rewind(v);
  } else {
    cam.style.transform = "";
    await wait(reduce ? 0 : 900);
  }
  scene.classList.remove("busy");
  current = -1; busy = false;
}

$("close").addEventListener("click", close);
addEventListener("keydown", e=>{ if(e.key === "Escape") close(); });

$("sizes").addEventListener("click", e=>{
  const b = e.target.closest("button[data-s]");
  if(!b || b.disabled) return;
  $("sizes").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true");
  size = +b.dataset.s; resetAdd();
});
function resetAdd(){ const a=$("add"); a.removeAttribute("data-hint"); a.textContent = size ? `Add to bag · EU ${size}` : "Add to bag"; }
$("add").addEventListener("click", ()=>{
  const a = $("add");
  if(!size){ a.setAttribute("data-hint",""); a.textContent = "Pick a size first"; return; }
  bag++;
  const c = $("bagCount"); c.textContent = bag; c.classList.add("pop"); setTimeout(()=>c.classList.remove("pop"),300);
  const p = PAIRS[current];
  toast(`Added: ${p.name} ${p.color}, EU ${size}`);
});
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* Index list */
$("list").innerHTML = PAIRS.map((p,i)=>`<button class="item" data-i="${i}"><img src="${p.img}" alt="" loading="lazy"><div><b>${p.name}</b><small>${p.color} · Tier ${p.id}</small></div><span>${fmt(p.price)}</span></button>`).join("");
$("list").addEventListener("click", async e=>{
  const b = e.target.closest(".item"); if(!b) return;
  const i = +b.dataset.i;
  if(current >= 0){ await close(); }
  scene.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"});
  setTimeout(()=>open(i), reduce ? 0 : 500);
});
$("band").innerHTML = (PAIRS.map(p=>`${p.name}<i>/</i>`).join("")).repeat(4);
</script>
</body>
</html>
